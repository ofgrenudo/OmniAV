services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-omniav}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-omniav}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-omniav}
      DB_PORT: 5432
      DB_SSLMODE: disable
      AUTH_BASE_URL: ${AUTH_BASE_URL:-https://localhost}
      AUTH_FRONTEND_URL: ${AUTH_FRONTEND_URL:-https://localhost}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?set AUTH_SESSION_SECRET}
      AUTH_SECURE_COOKIES: ${AUTH_SECURE_COOKIES:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_TENANT: ${AZURE_TENANT:-common}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  proxy:
    build:
      context: ./proxy
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      TLS_CERT_FILE: ${TLS_CERT_FILE:-tls.crt}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-tls.key}
      TLS_SERVER_NAME: ${TLS_SERVER_NAME:-localhost}
    # Default is a named volume holding the generated self-signed cert. In production set
    # TLS_CERT_DIR to a host directory containing the real certificate and key.
    volumes:
      - ${TLS_CERT_DIR:-proxy_certs}:/etc/nginx/certs
    depends_on:
      - frontend
      - backend

volumes:
  db_data:
  proxy_certs:
